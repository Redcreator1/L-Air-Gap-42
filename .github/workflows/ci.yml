name: CI

# Un seul déclencheur par changement : la pull request (le push sur la même branche ne relance pas).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifications statiques et chiffrement
        run: npm run check
      - name: Build (mode démo)
        run: npm run build
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run e2e
