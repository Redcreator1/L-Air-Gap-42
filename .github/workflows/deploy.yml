name: Build & deploy (GitHub Pages)

# Publication via la branche gh-pages : sur un dépôt public, GitHub active Pages
# automatiquement au premier push de cette branche. Aucun réglage manuel, et pas
# besoin des droits d'administration que réclame actions/configure-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifications (curriculum, crypto, liens)
        run: npm run check

      - name: Build
        # Aucun secret : l'archive de niveaux est déjà chiffrée et versionnée dans le dépôt.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Publier sur gh-pages
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement de ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Publié : https://$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr 'A-Z' 'a-z').github.io/$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
