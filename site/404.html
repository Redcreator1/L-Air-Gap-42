<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Page introuvable — L'Air Gap 42</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/L-Air-Gap-42/assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/L-Air-Gap-42/assets/css/main.css">
  <script type="module" src="/L-Air-Gap-42/assets/js/site.js"></script>
  <script>
    // Si le site est servi ailleurs qu'en /L-Air-Gap-42/ (domaine perso, local), on recalcule les chemins.
    (function () {
      var base = location.pathname.startsWith('/L-Air-Gap-42/') ? '/L-Air-Gap-42/' : '/';
      if (base === '/') {
        document.querySelectorAll('link[href^="/L-Air-Gap-42/"],script[src^="/L-Air-Gap-42/"]').forEach(function (el) {
          var a = el.href ? 'href' : 'src';
          var clone = el.cloneNode();
          clone[a] = el[a].replace('/L-Air-Gap-42/', '/');
          el.replaceWith(clone);
        });
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('a[href^="/L-Air-Gap-42/"]').forEach(function (a) {
            a.setAttribute('href', a.getAttribute('href').replace('/L-Air-Gap-42/', '/'));
          });
        });
      }
    })();
  </script>
</head>

  <header id="nav"></header>
  <main>

<span class="dim">Aucun pont trouvé. C’est plutôt bon signe.</span></div></div>
        <h1 style="font-size:2rem">Page introuvable</h1>
        <p class="lead" style="margin-inline:auto">Le lien est peut-être obsolète, ou la page a été déplacée.</p>
        <a class="btn btn-primary" href="/L-Air-Gap-42/">Retour à l’accueil</a>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
</body>
</html>
